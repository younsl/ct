# -- (string) Override the chart name
nameOverride: ""
# -- (string) Override the full release name
fullnameOverride: ""

image:
  # -- (string) Image registry host
  registry: ghcr.io
  # -- (string) Image repository without the registry
  repository: younsl/kagent-gateway
  # -- (string) Image tag. Empty uses the chart appVersion
  tag: ""
  # -- (string) Image digest (`sha256:...`), pinned as `tag@digest` when set
  digest: ""
  # -- (string) Image pull policy
  pullPolicy: IfNotPresent

# -- (list) Image pull secrets
imagePullSecrets: []

crds:
  # -- (bool) Install and upgrade the AgentAccessPolicy CRD
  install: true
  # -- (bool) Keep the CRD (and every policy) on `helm uninstall`
  keep: true
  # -- (object) Extra CRD annotations
  annotations: {}
  # -- (object) Extra CRD labels
  additionalLabels: {}

# -- (int) Replicas. Deduplication is in memory per replica, so more than one can analyse an alert group twice
replicaCount: 1

# -- (int) Old ReplicaSets kept for rollback
revisionHistoryLimit: 3

# -- (object) Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    # -- (string|int) Max extra Pods during an update
    maxSurge: 25%
    # -- (string|int) Max unavailable Pods during an update
    maxUnavailable: 25%

slack:
  # -- (string) `lookup` threads under the notification Alertmanager posted (needs the history and read scopes). `post` publishes the alert itself
  parentMode: "lookup"
  # -- (string) How far back `lookup` searches channel history
  lookupWindow: "15m"
  # -- (int) `lookup` attempts, since the notification can land after the webhook
  lookupAttempts: 3
  # -- (string) Reaction on the alert while the agent investigates. Needs `reactions:write`. Empty disables it
  investigatingReaction: "telescope"
  # -- (string) Reaction that replaces `investigatingReaction` once the analysis is posted. Empty disables it
  completedReaction: "white_check_mark"
  # -- (string) Channel used when the routing label is absent. A conversation ID skips the `channels:read` lookup
  defaultChannel: ""
  # -- (string) Alert label that selects the channel
  channelLabel: "slack_channel"
  # -- (object) Routing label value to channel, for values that are not channel names. Ignored under `chat.accessPolicies`
  channelMap: {}
    # test-route: alerts-test
  # -- (int) Max characters per message, longer text is truncated
  maxTextLength: 8000
  # -- (string) Slack Web API base URL
  apiURL: "https://slack.com/api"
  # -- (string) Existing Secret with the tokens. Empty creates one from `slack.token` and `slack.appToken`
  existingSecret: ""
  # -- (string) Bot token key in the Secret
  existingSecretKey: "SLACK_BOT_TOKEN"
  # -- (string) Bot token (`xoxb-`), used when `slack.existingSecret` is empty
  token: ""
  # -- (string) App-level token key in the Secret, read when `chat.enabled`
  existingSecretAppTokenKey: "SLACK_APP_TOKEN"
  # -- (string) App-level token (`xapp-`, `connections:write`) for Socket Mode, used when `slack.existingSecret` is empty
  appToken: ""

chat:
  # -- (bool) Answer `@bot` mentions in threads. Needs an app-level token, `app_mentions:read`, Socket Mode, and the `app_mention` event
  enabled: false
  # -- (string) Agent that answers mentions. Empty uses `kagent.agent`
  agent: ""
  # -- (object) Channel (name or ID) to Agent. Unlisted channels use `chat.agent`. Ignored under `chat.accessPolicies`
  agentMap: {}
    # security-alerts: security-alert-triage-agent
  # -- (list) Channels allowed to invoke the bot. Empty allows every channel it is in. Ignored under `chat.accessPolicies`
  channels: []
    # - alerts-test
  accessPolicies:
    # -- (bool) Route every mention and alert through AgentAccessPolicies and drop what none matches. Replaces the env routing maps and adds a Role in `kagent.namespace`
    enabled: false
  # -- (string) Instructions appended to every mention prompt. Empty uses the built-in ones
  instructions: ""
  # -- (string) X-User-Id for mention turns. Empty uses `kagent.userID`. Set it to keep agent memory of the two paths apart
  userID: ""
  # -- (string) Deadline for one turn including queueing. The kagent controller caps a turn at 3m
  timeout: "180s"
  # -- (string) How long a thread keeps its agent session after the last turn. `0s` starts every mention fresh
  sessionTTL: "2h"
  # -- (string) Refresh interval of an unchanged status (at most 60s for the typing indicator). Changes show within a second
  statusInterval: "10s"
  # -- (string) `assistant` shows Slack's typing indicator and posts the answer as one reply. `message` rewrites a status reply into the answer
  statusStyle: "assistant"
  # -- (string) Ephemeral hint for a mention outside a thread. `null` uses the built-in text, empty drops it silently
  threadHint: null
  # -- (string) Ephemeral hint for a mention in a channel not served. `null` uses the built-in text, empty drops it silently
  deniedHint: null
  # -- (int) Max mention turns at once, separate from `analysis.maxConcurrent`
  maxConcurrent: 2

# -- (object) AgentAccessPolicies by name: `enabled` (default `true`) and the CR `spec`. Needs `chat.accessPolicies.enabled`
agentAccessPolicies: {}
  # security-alert-triage-agent:
  #   enabled: true
  #   spec:
  #     match:
  #       slackChannels:
  #         - security-alerts
  #       alertLabel:
  #         name: slack_channel
  #         values:
  #           - security-alerts
  #     alertChannel: security-alerts
  #     agentRefs:
  #       - group: kagent.dev
  #         kind: Agent
  #         name: security-alert-triage-agent
  #         namespace: kagent
  #         weight: 1
  #     chat:
  #       allowedUsers:
  #         - U01234567
  # aws-alert-triage-agent:
  #   enabled: true
  #   spec:
  #     agentRefs:
  #       - group: kagent.dev
  #         kind: Agent
  #         name: aws-alert-triage-agent
  #         namespace: kagent
  #         weight: 90
  #       - group: kagent.dev
  #         kind: Agent
  #         name: aws-alert-triage-agent-canary
  #         namespace: kagent
  #         weight: 10
  #     chat:
  #       allowAll: true

kagent:
  # -- (string) kagent controller base URL
  url: "http://kagent-controller.kagent:8083"
  # -- (string) Namespace of the Agent resources
  namespace: "kagent"
  # -- (string) Agent used when the routing label maps to none
  agent: "alert-triage-agent"
  # -- (string) Alert label that selects the agent. Empty uses `slack.channelLabel`
  agentRoutingLabel: ""
  # -- (object) Routing label value to Agent. Unlisted values use `kagent.agent`. Ignored under `chat.accessPolicies`
  agentRoutingMap: {}
    # infra-alerts: aws-alert-triage-agent
    # security-alerts: security-alert-triage-agent
  # -- (string) X-User-Id that owns the sessions the gateway creates
  userID: "gateway@kagent.dev"
  # -- (string) Deadline for one analysis including queueing. The task is cancelled on expiry
  timeout: "120s"
  # -- (string) Timeout of one controller call
  requestTimeout: "30s"
  # -- (string) Task status poll interval, which bounds how fast progress shows
  pollInterval: "5s"

analysis:
  # -- (string) Comma-separated severities to analyse. Empty analyses every alert
  severities: "critical"
  # -- (string) Alert label that opts a rule in (`true`) or out (`false`) regardless of severity
  label: "analyze"
  # -- (bool) Analyse resolved notifications too
  resolved: false
  # -- (string) Suppression after an analysis, covering the Alertmanager `repeat_interval`. `0s` disables it
  dedupeTTL: "12h"
  # -- (int) Max alerts per prompt
  maxAlerts: 5
  # -- (int) Max analyses at once
  maxConcurrent: 2
  # -- (string) Instructions appended to every analysis prompt. Empty uses the built-in ones
  instructions: ""

webhook:
  # -- (string) Path Alertmanager posts to
  path: "/alert"
  # -- (string) Existing Secret with the bearer token. Empty creates one from `webhook.token`
  existingSecret: ""
  # -- (string) Bearer token key in the Secret
  existingSecretKey: "WEBHOOK_BEARER_TOKEN"
  # -- (string) Bearer token required on the webhook. Empty disables authentication
  token: ""

log:
  # -- (string) Log level: debug, info, warn, error
  level: "info"
  # -- (string) Log format: json or text
  format: "json"

# -- (list) Extra container env entries
extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.example.com:3128

# -- (list) Extra container envFrom entries
extraEnvFrom: []
  # - secretRef:
  #     name: extra-secret

ports:
  # -- (int) Port for the webhook, `/healthz`, and `/readyz`
  http: 8080
  # -- (int) Port for `/metrics`
  metrics: 8081

serviceAccount:
  # -- (bool) Create a ServiceAccount
  create: true
  # -- (string) ServiceAccount name. Empty uses the full name
  name: ""
  # -- (object) ServiceAccount annotations
  annotations: {}
  # -- (bool) Automount the ServiceAccount token
  automountServiceAccountToken: false
  # -- (list) Image pull secrets on the ServiceAccount
  imagePullSecrets: []

service:
  # -- (bool) Create a Service for the webhook and metrics ports
  enabled: true
  # -- (string) Service type
  type: ClusterIP
  # -- (string) Service `trafficDistribution`, e.g. PreferClose. Empty omits it
  trafficDistribution: ""

serviceMonitor:
  # -- (bool) Create a ServiceMonitor
  enabled: false
  # -- (string) Scrape interval
  interval: 30s
  # -- (string) Scrape timeout
  scrapeTimeout: 10s
  # -- (object) Extra ServiceMonitor labels
  labels: {}
  # -- (bool) Keep the metric's labels when they collide with the target's
  honorLabels: false
  # -- (list) Relabelings applied before scraping
  relabelings: []
  # -- (list) Metric relabelings applied before ingestion
  metricRelabelings: []

prometheusRule:
  # -- (bool) Create a PrometheusRule
  enabled: false
  # -- (string) PrometheusRule namespace. Empty uses the release namespace
  namespace: ""
  # -- (object) Extra PrometheusRule labels, e.g. the one Prometheus selects rules by
  labels: {}
  # -- (object) PrometheusRule annotations
  annotations: {}
  # -- (list) Rule groups as written. Empty creates no rule
  groups: []

# -- (object) Container resources
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- (list) Container resize policy for in-place resizing. Empty omits it
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer

# -- (int) Shutdown grace period. Keep it above the longer of `kagent.timeout` and `chat.timeout` plus 30s
terminationGracePeriodSeconds: 240

# -- (object) Extra Pod annotations
podAnnotations: {}
# -- (object) Extra Pod labels
podLabels: {}

# -- (object) Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- (object) Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- (object) Node selector
nodeSelector: {}
# -- (list) Tolerations
tolerations: []
# -- (object) Affinity
affinity: {}
# -- (object) Extra Pod spec fields, e.g. runtimeClassName. Fields the chart renders are rejected
extraPodSpec: {}
# -- (list) Topology spread constraints. A missing `labelSelector` uses the chart's selector labels
topologySpreadConstraints: []

# -- (string) Pod DNS policy. Empty omits it
dnsPolicy: ""
# -- (object) Pod DNS config. Empty omits it
dnsConfig: {}

# -- (list) Extra manifests rendered as written
extraObjects: []
