[package]
name = "imds-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Sidecar that serves EKS Pod Identity credentials through an EC2 instance metadata endpoint on loopback"
readme = "README.md"
repository = "https://github.com/younsl/ct"

[[bin]]
name = "imds-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "signal", "net", "time", "sync", "fs"] }
tokio-util = { version = "0.7", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
getrandom = "0.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus-client = "0.25"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
