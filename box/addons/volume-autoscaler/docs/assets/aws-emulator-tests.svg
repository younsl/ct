<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <style>
    .t{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{fill:#ededed;font-size:26px;font-weight:600;letter-spacing:-0.5px}
    .s{fill:#a1a1a1;font-size:16px}
    .n{fill:#ededed;font-size:17px;font-weight:600}
    .d{fill:#a1a1a1;font-size:15px}
    .l{fill:#8f8f8f;font-size:14px}
    .k{fill:#ededed;font-size:13px}
    .kc{fill:#ededed;font-size:12px}
    .kd{fill:#8f8f8f;font-size:13px}
    .e{fill:#8f8f8f;font-size:12px;letter-spacing:1.2px}
    .b{fill:#000;font-size:12px;font-weight:600}
    .card{fill:#0a0a0a;stroke:#2e2e2e}
    .hi{fill:#0a0a0a;stroke:#3291ff}
    .chip{fill:#111;stroke:#262626}
    .bound{fill:none;stroke:#2e2e2e;stroke-dasharray:4 4}
    .edge{stroke:#525252;stroke-width:1.5;fill:none}
    .lead{stroke:#3291ff;stroke-width:1.5;fill:none}
    .dash{stroke:#525252;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/>
    </marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3291ff"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#000"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <rect x="1068" y="30" width="92" height="26" rx="13" class="chip"/>
  <text x="1114" y="48" text-anchor="middle" class="t l">Testing</text>

  <text x="40" y="54" class="t h">Ignored tests drive the real AWS SDK clients against a local AWS Emulator</text>
  <text x="40" y="82" class="t s">No AWS account. The same Clients the controller ships call EC2, SSM, and IAM on 127.0.0.1 over HTTPS with SigV4</text>

  <g transform="translate(0,30)">
  <rect x="40" y="150" width="252" height="390" rx="8" class="card"/>
  <text x="56" y="176" class="m e">RUNNER</text>
  <text x="56" y="202" class="t n">make emulator-test</text>
  <text x="56" y="222" class="m kd">tests/aws-emulator/run.sh</text>
  <text x="56" y="256" class="t d">Builds the image, RPM</text>
  <text x="56" y="276" class="t d">verified with the AWS key</text>
  <text x="56" y="306" class="t d">Starts the container</text>
  <text x="56" y="326" class="t d">with telemetry off</text>
  <text x="56" y="356" class="t d">Exports the endpoint</text>
  <rect x="56" y="368" width="220" height="88" rx="4" class="chip"/>
  <text x="68" y="390" class="m kc">AWS_ENDPOINT_URL</text>
  <text x="68" y="414" class="m kc">SSL_CERT_FILE</text>
  <text x="68" y="438" class="m kc">AWS_SHARED_CREDENTIALS_FILE</text>
  <text x="56" y="486" class="t d">Removes the container</text>
  <text x="56" y="506" class="t d">and temp dir on exit</text>
  <rect x="320" y="110" width="440" height="450" rx="10" class="bound"/>
  <image x="336" y="120" width="22" height="22" href="data:image/svg+xml;base64,"/>
  <text x="366" y="137" class="m kd">cargo test --lib aws_emulator -- --ignored</text>

  <rect x="336" y="150" width="408" height="128" rx="6" class="card"/>
  <text x="352" y="176" class="m e">SRC/AWS_EMULATOR.RS</text>
  <text x="352" y="202" class="m k">root_volume_grows_through_modification_states</text>
  <text x="352" y="222" class="m k">throughput_and_iops_ride_along_with_the_resize</text>
  <text x="352" y="242" class="m k">run_script_reports_guest_output_and_failures</text>
  <text x="352" y="262" class="m k">reconcile_grows_a_tagged_instance_end_to_end</text>

  <rect x="336" y="294" width="408" height="150" rx="6" class="hi"/>
  <text x="352" y="320" class="m e">UNDER TEST</text>
  <rect x="644" y="306" width="84" height="22" rx="11" fill="#3291ff"/>
  <text x="686" y="321" text-anchor="middle" class="t b">real SDK</text>
  <text x="352" y="346" class="t n">Production clients</text>
  <text x="352" y="370" class="m k">Clients::new  aws-sdk-ec2, aws-sdk-ssm</text>
  <text x="352" y="390" class="m k">modify_volume, wait_for_modification</text>
  <text x="352" y="410" class="m k">run_script, Resizer::reconcile</text>
  <text x="352" y="430" class="t l">FakeSsm scripts df and growpart in reconcile</text>

  <rect x="336" y="460" width="408" height="84" rx="6" class="card"/>
  <text x="352" y="486" class="m e">SEED</text>
  <text x="352" y="510" class="t d">RunInstances with a 20 GiB gp3 root volume</text>
  <text x="352" y="530" class="t d">IAM role and SSM instance profile</text>
  <rect x="820" y="110" width="340" height="450" rx="10" class="bound"/>
  <text x="836" y="137" class="t l">AWS Emulator container <tspan class="m kd">127.0.0.1:9297</tspan></text>

  <rect x="836" y="150" width="308" height="190" rx="6" class="card"/>
  <text x="852" y="176" class="m e">EC2</text>
  <text x="852" y="202" class="m k">DescribeInstances</text>
  <text x="852" y="222" class="m k">DescribeVolumes</text>
  <text x="852" y="242" class="m k">ModifyVolume</text>
  <text x="852" y="262" class="m k">DescribeVolumesModifications</text>
  <text x="852" y="282" class="m k">DescribeInstanceTypes</text>
  <text x="852" y="310" class="t l">modifying, optimizing, completed</text>
  <text x="852" y="328" class="t l">500 ms apart</text>

  <rect x="836" y="356" width="308" height="104" rx="6" class="card"/>
  <text x="852" y="382" class="m e">SSM</text>
  <text x="852" y="406" class="m k">SendCommand</text>
  <text x="852" y="426" class="m k">GetCommandInvocation</text>
  <text x="852" y="448" class="t l">Guest shell runs echo, no df</text>

  <rect x="836" y="476" width="308" height="68" rx="6" class="card"/>
  <text x="852" y="502" class="m e">IAM</text>
  <text x="852" y="526" class="m k">CreateRole, CreateInstanceProfile</text>

  <rect x="820" y="590" width="340" height="44" rx="6" class="chip"/>
  <text x="836" y="617" class="t l">Temp dir <tspan class="m kd">ca.pem, emulator_credentials</tspan></text>
  <path d="M160 150 V100 H990 V106" class="edge" marker-end="url(#arrow)"/>
  <circle cx="575" cy="100" r="11" fill="#ededed"/>
  <text x="575" y="104.5" text-anchor="middle" class="t b">1</text>
  <text x="594" y="92" class="t l">build and start</text>

  <path d="M990 590 V570" class="dash"/>
  <path d="M820 612 H160 V544" class="dash" marker-end="url(#arrow)"/>
  <circle cx="575" cy="612" r="11" fill="#ededed"/>
  <text x="575" y="616.5" text-anchor="middle" class="t b">2</text>
  <text x="594" y="602" class="t l">writes CA and keys per run</text>

  <path d="M292 214 H332" class="edge" marker-end="url(#arrow)"/>
  <circle cx="310" cy="214" r="11" fill="#ededed"/>
  <text x="310" y="218.5" text-anchor="middle" class="t b">3</text>

  <path d="M744 330 H780 V245 H832" class="lead" marker-end="url(#arrow-hi)"/>
  <path d="M744 408 H832" class="lead" marker-end="url(#arrow-hi)"/>
  <path d="M744 510 H832" class="edge" marker-end="url(#arrow)"/>
  <circle cx="790" cy="408" r="11" fill="#3291ff"/>
  <text x="790" y="412.5" text-anchor="middle" class="t b">4</text>

  <text x="40" y="686" class="t s">The loopback guard fails every test when AWS_ENDPOINT_URL is not 127.0.0.1 or localhost, so no call reaches a real account</text>
  </g>
</svg>
