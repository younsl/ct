# -- CustomResourceDefinitions for alert rules
crds:
  # -- (bool) Install and upgrade CRDs
  install: true
  # -- (bool) Keep CRDs on chart uninstall
  keep: true
  # -- (object) Additional annotations to be added to all CRDs
  annotations: {}
  # -- (object) Additional labels to be added to all CRDs
  additionalLabels: {}

# -- (string) Override the name of the chart
nameOverride: ""

# -- (string) Override the full name of the chart
fullnameOverride: ""

# -- (int) Deprecated, use server.replicaCount. The scraper always runs one replica
replicaCount: 1

# -- (int) Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 10

# -- Image settings shared by both components. Repository and digest are set per component
image:
  # -- (string) Container image registry host
  registry: ghcr.io
  # -- (string) Image pull policy
  pullPolicy: IfNotPresent
  # -- (string) Image tag for both components (defaults to chart appVersion)
  tag: ""

# -- (list) Image pull secrets for private registries
imagePullSecrets: []

# -- ServiceAccount configuration
serviceAccount:
  # -- (bool) Create a ServiceAccount
  create: true
  # -- (bool) Automount service account token
  automount: true
  # -- (object) Annotations to add to the ServiceAccount
  annotations: {}
  # -- (string) Name of the ServiceAccount (auto-generated if empty)
  name: ""

# -- (object) Annotations to add to the pod
podAnnotations: {}

# -- (object) Labels to add to the pod
podLabels: {}

# -- Pod security context configuration
podSecurityContext:
  # -- (bool) Run as non-root user
  runAsNonRoot: true
  # -- (int) User ID to run as
  runAsUser: 1000
  # -- (int) Group ID to run as
  runAsGroup: 1000
  # -- (int) Filesystem group ID
  fsGroup: 1000

# -- Container security context configuration
securityContext:
  # -- (bool) Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Capabilities to drop
  capabilities:
    drop:
      - ALL
  # -- (bool) Mount root filesystem as read-only
  readOnlyRootFilesystem: true

# -- (string) Cluster name identifier recorded on the Hub's own reports.
clusterName: "local"

# -- Scraper pod: watchers, the report database, the internal API, and alert evaluation. Runs one replica
scraper:
  # -- Scraper image. Registry, tag, and pull policy come from `image`.
  image:
    # -- (string) Image repository path without registry prefix
    repository: younsl/trivy-collector-scraper
    # -- (string) Image digest (`sha256:...`), appended as `tag@digest`
    digest: ""
  # -- (list) Namespaces the local watcher scans on the Hub cluster (empty = all)
  namespaces: []
  # -- (bool) Watch the Hub cluster's own reports. Disable if Trivy Operator is not installed there
  watchLocal: true
  # -- Report kinds watched on every cluster. Disabling SbomReports shrinks the database most
  collect:
    # -- (bool) Watch VulnerabilityReports.
    vulnerabilityReports: true
    # -- (bool) Watch SbomReports.
    sbomReports: true
  # -- emptyDir holding the report database, rebuilt from the watched clusters on every start
  storage:
    # -- (string) Where the database lives inside the container.
    mountPath: /data
    # -- (string) emptyDir sizeLimit. Covers the database plus WAL churn, keep it equal to the ephemeral-storage limit
    sizeLimit: 2Gi
    # -- (string) emptyDir medium. "Memory" counts against the pod memory limit
    medium: ""
  # -- (object) Deployment strategy. The outgoing pod serves reads until the new one is hydrated
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- (object) Readiness probe. Fails until every cluster finishes its initial sync
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  # -- (object) Resource requests and limits. ephemeral-storage covers the emptyDir database
  resources:
    limits:
      memory: 512Mi
      ephemeral-storage: 2Gi
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 2Gi
  # -- (list) In-place resize policy. CPU resizes without a restart, memory restarts the container
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: RestartContainer
  # -- (object) Node selector.
  nodeSelector: {}
  # -- (list) Tolerations.
  tolerations: []
  # -- (object) Affinity rules.
  affinity: {}
  # -- (object) Extra Pod spec fields such as runtimeClassName. Fields the chart renders are rejected
  extraPodSpec: {}
  # -- (list) Topology spread constraints.
  topologySpreadConstraints: []
  # -- ServiceMonitor for scraper (requires Prometheus Operator).
  serviceMonitor:
    # -- (bool) Create a ServiceMonitor for the scraper pod.
    enabled: false
    # -- (string) Scrape interval.
    interval: 30s
    # -- (string) Scrape timeout (defaults to Prometheus global when empty).
    scrapeTimeout: ""
    # -- (object) Additional labels to attach to the ServiceMonitor.
    additionalLabels: {}
    # -- (object) Annotations to attach to the ServiceMonitor.
    annotations: {}

# -- Server pod: UI, REST API, and MCP server. Stateless, scale freely
server:
  # -- Server image. Registry, tag, and pull policy come from `image`.
  image:
    # -- (string) Image repository path without registry prefix
    repository: younsl/trivy-collector-server
    # -- (string) Image digest (`sha256:...`), appended as `tag@digest`
    digest: ""
  # -- (int) Deprecated, use server.replicaCount. The scraper always runs one replica
  replicaCount: 1
  # -- PodDisruptionBudget for the server, created only with more than one replica
  podDisruptionBudget:
    # -- (bool) Create a PodDisruptionBudget.
    enabled: true
    # -- (string) Minimum available pods. Takes precedence when set.
    minAvailable: ""
    # -- (int) Maximum unavailable pods.
    maxUnavailable: 1
  # -- (int) HTTP server port
  port: 3000
  # -- (string) Base URL for notification deep links. Empty derives it from gateway.hostnames
  externalUrl: ""
  # -- (object) Resource requests and limits
  resources:
    limits:
      memory: 96Mi
    requests:
      cpu: 20m
      memory: 48Mi
  # -- (list) In-place resize policy. CPU resizes without a restart, memory restarts the container
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: RestartContainer
  # -- (object) Node selector.
  nodeSelector: {}
  # -- (list) Tolerations.
  tolerations: []
  # -- (object) Affinity rules.
  affinity: {}
  # -- (object) Extra Pod spec fields such as runtimeClassName. Fields the chart renders are rejected
  extraPodSpec: {}
  # -- (list) Topology spread constraints.
  topologySpreadConstraints: []
  # -- Embedded MCP server at `/mcp`, gated by the REST API's auth and RBAC
  mcp:
    # -- (bool) Mount the MCP endpoint at `/mcp`.
    enabled: false
    # -- (list) Allowed `Host` values for `/mcp`. Empty disables the check, required for Service DNS access
    allowedHosts: []
    # -- (bool) Serve MCP without sessions. Set true when server.replicaCount > 1.
    stateless: false
  # -- ServiceMonitor for server (requires Prometheus Operator).
  serviceMonitor:
    # -- (bool) Create a ServiceMonitor for the server pod.
    enabled: false
    # -- (string) Scrape interval.
    interval: 30s
    # -- (string) Scrape timeout (defaults to Prometheus global when empty).
    scrapeTimeout: ""
    # -- (object) Additional labels to attach to the ServiceMonitor.
    additionalLabels: {}
    # -- (object) Annotations to attach to the ServiceMonitor.
    annotations: {}

  # -- Gateway API HTTPRoute, the chart's only ingress path
  gateway:
    # -- (bool) Enable HTTPRoute
    enabled: false
    # -- (string) HTTPRoute name (defaults to fullname)
    name: ""
    # -- (list) Parent Gateway references
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: main-gateway
        namespace: gateway-system
        sectionName: https
    # -- (list) Hostnames for the route
    hostnames:
      - trivy.example.com
    # -- (list) HTTP route rules
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # -- (list) HTTPRoute filters, rendered verbatim
        filters: []
        # -- (list) HTTPBackendRefs rendered verbatim. Empty `name` uses the server Service
        backendRefs:
          - group: ""
            kind: Service
            name: ""
            port: 3000
            weight: 1

  # -- Authentication configuration (server mode only)
  auth:
    # -- (string) Authentication mode: "none" (anonymous) or "keycloak" (OIDC)
    mode: "none"
    # -- RBAC configuration (ArgoCD-style CSV policy)
    rbac:
      # -- (string) RBAC policy CSV (ArgoCD format)
      # @default -- See values
      policy: |
        p, role:readonly, reports, get, allow
        p, role:readonly, clusters, get, allow
        p, role:readonly, stats, get, allow
        p, role:readonly, tokens, get, allow
        p, role:readonly, tokens, create, allow
        p, role:admin, *, *, allow
        g, admin, role:admin
      # -- (string) Default RBAC policy for authenticated users without explicit group bindings
      defaultPolicy: "role:readonly"
    # -- SSO configuration (only used when auth.mode is "keycloak")
    sso:
      # -- (string) OIDC issuer URL (e.g., https://keycloak.example.com/realms/trivy)
      issuer: ""
      # -- OIDC client ID configuration
      clientId:
        # -- (string) Plaintext client ID value (used if set, takes precedence over secret reference)
        value: ""
        # -- (string) Secret name containing client ID
        name: ""
        # -- (string) Secret key for client ID
        key: client-id
      # -- OIDC client secret configuration
      clientSecret:
        # -- (string) Plaintext client secret value (used if set, takes precedence over secret reference)
        value: ""
        # -- (string) Secret name containing client secret
        name: ""
        # -- (string) Secret key for client secret
        key: client-secret
      # -- (string) OIDC redirect URL (full callback URL, e.g., https://trivy.example.com/auth/callback)
      redirectUrl: ""
      # -- (list) OIDC scopes
      scopes:
        - openid
        - profile
        - email
        - groups

# -- Service configuration
service:
  # -- (string) Service type
  type: ClusterIP
  # -- (int) Service port
  port: 3000
  # -- (object) Annotations to add to the Service
  annotations: {}

# -- Internal API from the scraper to the server pods. Never exposed outside the namespace
internal:
  # -- (int) Port the scraper serves the internal read API on.
  port: 8081
  # -- (string) Shared internal token. Empty generates one on install, set it explicitly under GitOps
  token: ""
  # -- (string) Use an existing Secret for the token instead of managing one.
  existingSecret: ""
  # -- (string) Key inside the token Secret.
  secretKey: token
  # -- NetworkPolicy limiting the internal port to the server pods
  networkPolicy:
    # -- (bool) Create the NetworkPolicy
    enabled: true
    # -- (list) Additional `from` selectors allowed to reach the internal port.
    extraFrom: []

# -- Health check configuration
health:
  # -- (int) Health check server port
  port: 8080

# -- Logging configuration
logging:
  # -- (string) Log format: "json" or "pretty"
  format: json
  # -- (string) Log level: trace, debug, info, warn, error
  level: info

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  # -- (int) Initial delay before starting probes
  initialDelaySeconds: 10
  # -- (int) Probe interval
  periodSeconds: 30
  # -- (int) Probe timeout
  timeoutSeconds: 5
  # -- (int) Number of failures before marking unhealthy
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: health
  # -- (int) Initial delay before starting probes
  initialDelaySeconds: 5
  # -- (int) Probe interval
  periodSeconds: 10
  # -- (int) Probe timeout
  timeoutSeconds: 5
  # -- (int) Number of failures before marking not ready
  failureThreshold: 3

# -- (string) DNS policy for the pod (ClusterFirst, ClusterFirstWithHostNet, Default, None)
# @default -- ""
dnsPolicy: ""

# -- (object) DNS configuration for the pod
# @default -- {}
dnsConfig: {}
  # nameservers:
  #   - 8.8.8.8
  # searches:
  #   - example.com
  # options:
  #   - name: ndots
  #     value: "2"

# -- One-shot export of API tokens and notes from a legacy PVC into a Secret and a ConfigMap
migration:
  exportState:
    # -- (bool) Run the export as a pre-install/pre-upgrade hook Job.
    enabled: false
    # -- (string) Name of the existing PVC holding the legacy database.
    existingClaim: ""
    # -- (string) Path to the legacy database inside that volume.
    dbPath: /data/trivy.db
    # -- (bool) Report what would be written without writing it.
    dryRun: false
    # -- (int) Job backoff limit.
    backoffLimit: 2
    # -- (int) Seconds to keep the finished Job.
    ttlSecondsAfterFinished: 3600
    # -- (object) Node selector. Defaults to the scraper's, since the legacy PVC is ReadWriteOnce
    nodeSelector: {}
    # -- (list) Tolerations. Defaults to the scraper's
    tolerations: []
    # -- (object) Affinity rules. Defaults to the scraper's.
    affinity: {}
    # -- (object) Extra Pod spec fields such as runtimeClassName. Fields the chart renders are rejected
    extraPodSpec: {}
    # -- (object) Resource requests and limits.
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# -- (list) Extra Kubernetes objects to deploy alongside the chart
# @default -- []
extraObjects: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: extra-config
  #   data:
  #     key: value
