apiVersion: trivy-collector.security.io/v1alpha1
kind: AlertRule
metadata:
  name: cvss-by-environment
  namespace: trivy-system
spec:
  description: "A stricter threshold in prod than in stage, with each term scoped to its own clusters."
  matcherTerms:
    - clusters: [prod]
      excludeNamespaces: [kube-system]
      vulnerability:
        minScore: 7.0
    - clusters: [stage]
      vulnerability:
        severities: [CRITICAL]
        minScore: 9.0
  receivers:
    - name: security-team
      slack:
        webhookUrl: https://hooks.slack.com/services/T0/B0/XXXX
