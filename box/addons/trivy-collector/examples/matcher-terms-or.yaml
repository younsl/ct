apiVersion: trivy-collector.security.io/v1alpha1
kind: AlertRule
metadata:
  name: log4shell-or-cvss-9
  namespace: trivy-system
spec:
  description: "Terms are ORed, fields inside a term are ANDed: (log4j-core < 2.17.0) OR (CVE-2021-44228) OR (CVSS >= 9.0 AND fixable)."
  matcherTerms:
    - packageName: log4j-core
      versionExpr: "<2.17.0"
    - vulnerability:
        ids: [CVE-2021-44228]
    - vulnerability:
        minScore: 9.0
        fixAvailable: true
  receivers:
    - name: security-team
      slack:
        webhookUrl: https://hooks.slack.com/services/T0/B0/XXXX
