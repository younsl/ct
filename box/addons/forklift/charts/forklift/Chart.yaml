apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.25.2
appVersion: "0.22.2"
home: https://github.com/younsl/ct/tree/main/box/addons/forklift
sources:
  - https://github.com/younsl/ct/tree/main/box/addons/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.52.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.22.2. Analyze now on the security insights page keeps showing the run until its report lands on an active-active install, instead of going back to idle with the old report"
    - kind: fixed
      description: "appVersion 0.22.2. A coverage scan or insights analysis asked for on an API pod is reported as running from the moment the worker claims it"
