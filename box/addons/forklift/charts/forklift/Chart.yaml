apiVersion: v2
name: forklift
description: Lightweight Kubernetes-native artifact repository (Maven, npm, Cargo, Go, PyPI) with proxy caching and supply-chain controls (age policy, package approval, vulnerability scanning)
type: application
deprecated: false
version: 0.25.1
appVersion: "0.22.1"
home: https://github.com/younsl/ct/tree/main/box/addons/forklift
sources:
  - https://github.com/younsl/ct/tree/main/box/addons/forklift/charts/forklift
dependencies:
  - name: seaweedfs
    version: "4.52.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
maintainers:
  - name: younsl
    email: cysl@kakao.com
    url: https://github.com/younsl
keywords:
  - artifact-repository
  - proxy
  - maven
  - npm
  - cargo
  - go-modules
  - pypi
  - nexus
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.22.1. Scan now and Analyze now work on every API pod of an active-active install, and every pod shows the running scan"
    - kind: security
      description: "appVersion 0.22.1. rustls, rustls-webpki, rusqlite (bundled SQLite), zip, openidconnect and rmcp updated for RUSTSEC advisories"
