<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3291ff"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#000000"/>
  <rect width="1200" height="660" fill="url(#grid)"/>

  <text x="40" y="58" fill="#3291ff" font-size="13" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ACCESS CONTROL</text>
  <text x="40" y="98" fill="#ededed" font-size="28" font-weight="600">A role must grant every request, and a token must also scope it</text>

  <rect x="1042" y="40" width="118" height="30" rx="15" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="1101" y="60" fill="#8b8b8b" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Security</text>

  <!-- 01 Identity -->
  <rect x="40" y="150" width="230" height="300" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="68" cy="178" r="13" fill="#000" stroke="#3a3a3a"/>
  <text x="68" y="183" fill="#ededed" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
  <text x="92" y="184" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IDENTITY</text>
  <rect x="60" y="210" width="190" height="96" rx="8" fill="#000" stroke="#2e2e2e"/>
  <text x="76" y="242" fill="#ededed" font-size="18" font-weight="600">Session</text>
  <text x="76" y="268" fill="#a1a1a1" font-size="17">OIDC or local login</text>
  <text x="76" y="290" fill="#a1a1a1" font-size="17">manages everything</text>
  <rect x="60" y="326" width="190" height="104" rx="8" fill="#000" stroke="#3291ff"/>
  <text x="76" y="358" fill="#ededed" font-size="18" font-weight="600">Access token</text>
  <text x="76" y="384" fill="#a1a1a1" font-size="17">reads and pushes,</text>
  <text x="76" y="406" fill="#a1a1a1" font-size="17">never manages</text>

  <!-- 02 Roles -->
  <rect x="330" y="150" width="240" height="300" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="358" cy="178" r="13" fill="#000" stroke="#3a3a3a"/>
  <text x="358" y="183" fill="#ededed" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
  <text x="382" y="184" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ROLES</text>
  <text x="352" y="234" fill="#ededed" font-size="18" font-weight="600">Owner's roles</text>
  <text x="352" y="270" fill="#a1a1a1" font-size="17">Assigned to the user</text>
  <text x="352" y="300" fill="#a1a1a1" font-size="17">Mapped from a group</text>
  <text x="352" y="330" fill="#a1a1a1" font-size="17">The default role</text>
  <line x1="352" y1="364" x2="548" y2="364" stroke="#2e2e2e"/>
  <text x="352" y="398" fill="#a1a1a1" font-size="17">Read again on</text>
  <text x="352" y="420" fill="#a1a1a1" font-size="17">every request</text>

  <!-- 03 Permissions -->
  <rect x="630" y="150" width="280" height="300" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="658" cy="178" r="13" fill="#000" stroke="#3a3a3a"/>
  <text x="658" y="183" fill="#ededed" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</text>
  <text x="682" y="184" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PERMISSIONS</text>
  <text x="652" y="226" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REPOSITORY + PATTERN</text>
  <text x="652" y="254" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">repo.read  .write</text>
  <text x="652" y="278" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.delete  .approve</text>
  <text x="652" y="302" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.security  .admin</text>
  <line x1="652" y1="322" x2="888" y2="322" stroke="#2e2e2e"/>
  <text x="652" y="350" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GLOBAL, NO PATTERN</text>
  <text x="652" y="378" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">user role audit</text>
  <text x="652" y="402" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">approval insights</text>
  <text x="652" y="426" fill="#ededed" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">system ...  and *</text>

  <!-- 04 Decision -->
  <rect x="970" y="150" width="190" height="300" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="998" cy="178" r="13" fill="#000" stroke="#3a3a3a"/>
  <text x="998" y="183" fill="#ededed" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
  <text x="1022" y="184" fill="#8b8b8b" font-size="13" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISION</text>
  <text x="992" y="234" fill="#ededed" font-size="18" font-weight="600">Allowed when</text>
  <text x="992" y="270" fill="#a1a1a1" font-size="17">a role grants it</text>
  <text x="992" y="294" fill="#a1a1a1" font-size="17">on this repository</text>
  <text x="992" y="330" fill="#3291ff" font-size="17">and, for a token,</text>
  <text x="992" y="354" fill="#3291ff" font-size="17">a scope grants it</text>
  <line x1="992" y1="378" x2="1138" y2="378" stroke="#2e2e2e"/>
  <text x="992" y="410" fill="#a1a1a1" font-size="17">Otherwise 403</text>

  <!-- main flow -->
  <line x1="270" y1="258" x2="326" y2="258" stroke="#8b8b8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="300" x2="626" y2="300" stroke="#8b8b8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="300" x2="966" y2="300" stroke="#8b8b8b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="378" x2="326" y2="378" stroke="#8b8b8b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- token scope path -->
  <path d="M 155 430 V 552 H 470" fill="none" stroke="#3291ff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <rect x="474" y="510" width="400" height="84" rx="10" fill="#0a0a0a" stroke="#3291ff"/>
  <text x="494" y="542" fill="#ededed" font-size="18" font-weight="600">Token scope</text>
  <text x="494" y="572" fill="#a1a1a1" font-size="17">repo.read .write .delete and global reads</text>
  <path d="M 874 552 H 1065 V 454" fill="none" stroke="#3291ff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <text x="40" y="632" fill="#8b8b8b" font-size="15">A grant or a managed user never exceeds the permissions of the person making the change.</text>
</svg>
