name: CI Audit

run-name: "🛡️ Audit addon dependencies on ${{ github.ref_name }}"

# Advisories land without any change in this repository, hence the daily run.
on:
  pull_request:
    branches: [main]
    paths: &paths
      - 'box/addons/**/Cargo.toml'
      - 'box/addons/**/Cargo.lock'
      - 'box/addons/**/.cargo/audit.toml'
      - 'box/addons/**/package.json'
      - 'box/addons/**/package-lock.json'
      - 'box/addons/**/pnpm-lock.yaml'
      - 'box/addons/**/pnpm-workspace.yaml'
      - 'box/addons/**/.npm-audit-ignore'
      - 'scripts/audit-lockfiles.sh'
      - '.github/workflows/ci-audit.yml'
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: ci-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: box/addons/forklift/web/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-audit

      - name: Audit every addon lockfile
        run: scripts/audit-lockfiles.sh
